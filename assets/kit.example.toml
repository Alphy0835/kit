# Настройка набора для проекта. Файл кладётся в корень репозитория под именем kit.toml.
# Значения ниже — как в проекте с папкой team/ (задачи, отчёты, список задач).

[git]
main = "master"                 # основная ветка
task_branch = "task/{id}"       # ветка задачи; {id} — номер задачи, {code} — код подпроекта
# Служебные файлы: статусы в них меняют и тим лид в main, и исполнитель в ветке. Конфликт в них решает
# тим лид при слиянии, поэтому сдачу он не останавливает.
bookkeeping = ["team/BACKLOG.md", "team/tasks/*"]

# Рабочая копия задачи: хук заводит её на команде /<роль> <задача> (scripts/handoff/worktree.py).
# Путь — вне папки, которая синхронизируется с облаком. {home}, {repo} — имя папки проекта, {id}, {code}.
[worktree]
path = "{home}/.kit-worktrees/{repo}/{id}"
copy = [".env"]                               # настройки вне git: копируются в новую копию, если их там нет
roles = ["backend", "frontend", "designer"]   # чьим командам заводить копию

[files]
task = "team/tasks/{code}/{id}.md"
report = "team/reports/{code}/{id}-report.md"
backlog = "team/BACKLOG.md"     # таблица со столбцом «Статус»; уберите строку, если списка нет
access = "team/ACCESS.md"       # карта доступов: где взять ключи, вебхуки, учётки; значений в ней нет

[task]
criteria_section = "Критерии приёмки"   # раздел задания со строками «- [ ] …»
handoff_status = "REVIEW"               # статус, с которым задачу сдают
max_lines = 80                          # больше — предупреждение, не стоп

[report]
criteria_section = "Самопроверка по критериям приёмки"
labels = ["[вживую]", "[тесты]", "[не проверено]"]
# checks_section = "Пять проверок перед сдачей"   # свой раздел проверок проекта, если он есть: строки «N. Проверка — итог»
edges_section = "Края"   # ответы на вопросы о краях из references/process/handoff.md, правило 2: «N. ответ» или «N. нет»
edges_count = 8
max_lines = 100

# Миграции с номером. Одна запись на файл: регулярное выражение находит номер в строке.
# Миграции лежат отдельными файлами — сюда пишут файл последней миграции из спецификации.
# Скрипт находит номера, которые ветка добавила после точки ответвления, и сверяет их с номерами,
# которые за то же время появились в main. Совпал номер — стоп: его заняла слитая задача.
# [[migrations]]
# file = "app/db/migrations.py"
# number = '^\s+(\d+),\s*$'

# Границы модулей: scripts/lint/boundaries.py по карте модулей спецификации, при каждой сдаче и приёмке.
# Импорт в модуль не из его «Может вызывать», мимо входа или по кругу — стоп.
# baseline — список старых нарушений {"known": [...]}: из списка проходит, новое — стоп. Завести в старом проекте:
# boundaries.py <spec> --baseline <файл> --update-baseline. Для нового проекта строку уберите.
# [boundaries]
# spec = "docs/spec.md"
# baseline = "docs/boundaries-known.json"

# Тесты для scripts/handoff/tests.py. Набор (suite) — одна папка, где запускается pytest.
# Правила владельца: файл продукта, который хук плагина подкладывает агенту в начале чата.
# Общий файл владельца — ~/.claude/kit/owner.md или переменная KIT_OWNER_RULES.
[rules]
project = "team/RULES.md"

[tests]
docs_only = ["*.md", "*/docs/*", "*.png"]   # правка только в таких файлах тестов кода не требует
# Какие файлы считать тестами (для краёв в check.py). Значение по умолчанию:
# test_files = ["*/tests/*", "tests/*", "*test_*.py", "*.test.js"]
# Линтер проекта целиком запускается из корня репозитория, если правка задела файлы .py.
# Строки правки смотрит отдельный scripts/lint/changed.py, его настройка — раздел [lint] ниже.
# lint = [["python", "-m", "ruff", "check", "."]]

[lint]
# scripts/lint/changed.py: Ruff только по строкам правки. Значения по умолчанию — в скрипте.
# stop = ["F401", "F841", "S110", "S112"]                              # находка останавливает сдачу
# warn = ["BLE001", "TRY400", "B904", "ERA001", "E741", "C901"]       # находка печатается
# skip = ["*/tests/*", "tests/*", "*test_*.py", "*/migrations/*"]
# Сканер секретов по коммитам правки; {base} и {ref} подставляет скрипт. Не установлен — предупреждение.
# secrets = ["betterleaks", "git", "--log-opts={base}..{ref}", "--no-banner", "--redact", "--exit-code", "1"]

[security]
# scripts/security/triggers.py и scan.py. Значения по умолчанию — в скриптах.
# tools_dir = "C:/tools/security"     # папка с betterleaks, osv-scanner, hadolint; иначе ищутся в PATH
# ruff_ignore = ["S101", "S105", "S106", "S107", "S110", "S112", "S404", "S603", "S607"]
# Свой повод позвать безопасника: added — выражение по добавленной строке кода, files — шаблоны путей,
# in_files — added только в этих файлах, weak = true — только заметка, безопасника одна не зовёт.
# [[security.triggers]]
# name = "Платёж"
# classes = [9]
# added = '''(?i)\b(?:payment|invoice|refund)\b'''

[[tests.suite]]
name = "Приложение"
root = "app"                  # папка, где лежит pytest.ini; пути тестов — от неё
paths = ["app/"]              # правка в этих путях задевает набор
tests = "tests"               # папка тестов внутри root
command = ["python", "-m", "pytest", "-n", "4"]
# Повторы при сбое окружения (упал воркер, вышел срок), не больше двух. Красный тест не повторяется.
retry = [["python", "-m", "pytest", "-n", "2"], ["python", "-m", "pytest", "-p", "no:xdist"]]
always = ["tests/test_module_boundaries.py"]          # тесты-переписи: гонятся при любой правке набора
full_when = ["app/db/*", "app/tests/conftest.py", "app/requirements*"]   # общий файл задет — полный прогон
expected_seconds = 120        # печатается до прогона, чтобы ждать, а не прерывать
timeout_seconds = 1200
# Node 22+ понимает только шаблон файлов, папку целиком не берёт: "tests/js/*.test.js".
# js = { when = ["app/static/*"], command = ["node", "--test", "tests/js/*.test.js"] }

# Края: в коде появилось то, что требует особого теста, а в тестах правки его не видно. Только предупреждение:
# скрипт не читает тест и не знает, верен ли он. Тестовыми считаются файлы из [tests] test_files.
# Вид по умолчанию: строка кода совпала с added, а в добавленных строках тестов нет need.
# В need можно поставить {path} — туда подставится найденный путь; номер в пути ({id}) совпадёт с любым куском.
[[edges]]
name = "новый маршрут без теста через точку входа"
code = ["*.py"]
added = '''@\w+\.(?:get|post|put|patch|delete)\(\s*["']([^"']+)["']'''
need = '''{path}["'?]'''

[[edges]]
name = "правка существующей таблицы без теста на старых данных"
code = ["*/migrations.py"]
added = '''(?i)(ALTER TABLE\s+\w+|ADD COLUMN\s+\w+|DROP (?:TABLE|COLUMN|INDEX)\s+\w+|^\s*UPDATE\s+\w+\s+SET)'''
need = '''(?i)(?<![a-z])(old|legacy|existing|upgrade|prior|stale)(?![a-z])'''

# Вид entry_file: правка в файле, где объявлены маршруты, а тесты не зовут ни один его адрес — ни путём,
# ни константой. Ловит тесты «мимо приёмника». В skip — файлы сборки приложения, где правка — подключение.
[[edges]]
name = "правка обработчика без теста через его адрес"
kind = "entry_file"
code = ["*.py"]
skip = ["app/main.py"]
route = '''@\w+\.(?:get|post|put|patch|delete)\(\s*(?:["']([^"']+)["']|([A-Z][A-Z0-9_]*))'''
